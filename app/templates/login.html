
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f8fafc">

    <title>تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans Arabic",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(59, 130, 246, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(99, 102, 241, 0.08),
                    transparent 35%
                ),
                #f8fafc;

            color: #0f172a;

            -webkit-font-smoothing: antialiased;
        }


        /* ================================
           Main
           ================================ */

        .login {
            width: 100%;
            max-width: 410px;
            margin: auto;
        }


        /* ================================
           Card
           ================================ */

        .card {
            width: 100%;

            padding: clamp(28px, 7vw, 44px);

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid rgba(15, 23, 42, 0.07);

            border-radius: 26px;

            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.08),
                0 6px 20px rgba(15, 23, 42, 0.04);

            text-align: center;
        }


        /* ================================
           Logo
           ================================ */

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.25);
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }


        /* ================================
           Title
           ================================ */

        h1 {
            font-size: clamp(25px, 7vw, 32px);

            font-weight: 800;

            line-height: 1.3;

            color: #0f172a;

            letter-spacing: -0.5px;
        }


        /* ================================
           Description
           ================================ */

        .description {
            margin-top: 10px;

            color: #64748b;

            font-size: clamp(13px, 3.8vw, 15px);

            line-height: 1.8;
        }


        /* ================================
           Google Button
           ================================ */

        .google-button {
            width: 100%;

            min-height: 54px;

            margin-top: 30px;

            padding: 12px 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 11px;

            border: 1px solid #d8dee8;

            border-radius: 14px;

            background: #ffffff;

            color: #1e293b;

            text-decoration: none;

            font-size: clamp(14px, 4vw, 16px);

            font-weight: 700;

            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .google-button:hover {
            background: #f8fafc;

            border-color: #cbd5e1;

            box-shadow:
                0 8px 22px rgba(15, 23, 42, 0.08);
        }

        .google-button:active {
            transform: scale(0.985);
        }

        .google-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.20);

            outline-offset: 3px;
        }

        .google-icon {
            width: 21px;
            height: 21px;

            flex: 0 0 21px;
        }


        /* ================================
           Very Small Phones
           ================================ */

        @media (max-width: 359px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 24px 17px;

                border-radius: 20px;
            }

            .logo {
                width: 56px;
                height: 56px;

                margin-bottom: 17px;

                border-radius: 17px;
            }

            .logo svg {
                width: 29px;
                height: 29px;
            }

            h1 {
                font-size: 23px;
            }

            .description {
                font-size: 12.5px;
            }

            .google-button {
                min-height: 51px;

                margin-top: 24px;

                padding: 10px;

                font-size: 13.5px;

                gap: 8px;
            }

            .google-icon {
                width: 19px;
                height: 19px;

                flex-basis: 19px;
            }
        }


        /* ================================
           Short Screens
           ================================ */

        @media (max-height: 600px) {

            body {
                align-items: flex-start;

                padding-top: 16px;
                padding-bottom: 16px;
            }

            .logo {
                width: 54px;
                height: 54px;

                margin-bottom: 13px;
            }

            .logo svg {
                width: 28px;
                height: 28px;
            }

            .google-button {
                margin-top: 22px;
            }
        }


        /* ================================
           Dark Mode
           ================================ */

        @media (prefers-color-scheme: dark) {

            body {
                background:
                    radial-gradient(
                        circle at 15% 15%,
                        rgba(59, 130, 246, 0.12),
                        transparent 35%
                    ),
                    #0f172a;
            }

            .card {
                background: #111827;

                border-color: rgba(255, 255, 255, 0.07);

                box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.25);
            }

            h1 {
                color: #f8fafc;
            }

            .description {
                color: #94a3b8;
            }

            .google-button {
                background: #1f2937;

                border-color: #374151;

                color: #f8fafc;
            }

            .google-button:hover {
                background: #273449;

                border-color: #475569;
            }
        }


        /* ================================
           Reduced Motion
           ================================ */

        @media (prefers-reduced-motion: reduce) {

            .google-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="login">

        <section class="card">

            <!-- Logo -->

            <div class="logo">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <rect
                        x="4"
                        y="5"
                        width="16"
                        height="14"
                        rx="3"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M10 9L15 12L10 15V9Z"
                        fill="currentColor"
                    />
                </svg>

            </div>


            <!-- Title -->

            <h1>
                تسجيل الدخول
            </h1>


            <!-- Description -->

            <p class="description">
                سجّل الدخول للمتابعة إلى المنصة
            </p>


            <!-- Google -->

            <a
                href="/auth/google/login"
                class="google-button"
                aria-label="تسجيل الدخول باستخدام Google"
            >

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        fill="#4285F4"
                        d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.16c1.85-1.7 2.9-4.2 2.9-7.38z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.6c2.64 0 4.86-.87 6.48-2.36l-3.16-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.04H3.25v2.53A9.79 9.79 0 0 0 12 21.6z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.51 13.67A5.88 5.88 0 0 1 6.2 12c0-.58.1-1.14.31-1.67V7.8H3.25A9.61 9.61 0 0 0 2.2 12c0 1.52.36 2.96 1.05 4.2l3.26-2.53z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.29c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.36 14.63 2.4 12 2.4a9.79 9.79 0 0 0-8.75 5.4l3.26 2.53C7.29 8.01 9.45 6.29 12 6.29z"
                    />
                </svg>

                <span>
                    تسجيل الدخول باستخدام Google
                </span>

            </a>

        </section>

    </main>

</body>
</html>
