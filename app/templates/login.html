
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f8fafc"
    >

    <meta
        name="description"
        content="تسجيل الدخول إلى منصة تحرير الفيديو"
    >

    <title>تسجيل الدخول</title>

    <style>
        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100dvh;
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans Arabic",
                "Noto Sans",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(99, 102, 241, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(59, 130, 246, 0.08),
                    transparent 35%
                ),
                #f8fafc;

            color: #0f172a;

            direction: rtl;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        a {
            font: inherit;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           PAGE
           ========================================================= */

        .page {
            min-height: 100dvh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
        }


        /* =========================================================
           CONTAINER
           ========================================================= */

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }


        /* =========================================================
           CARD
           ========================================================= */

        .card {
            width: 100%;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(15, 23, 42, 0.07);

            border-radius: 26px;

            padding: clamp(24px, 7vw, 42px);

            box-shadow:
                0 30px 70px rgba(15, 23, 42, 0.08),
                0 8px 24px rgba(15, 23, 42, 0.04);
        }


        /* =========================================================
           BRAND
           ========================================================= */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            margin-bottom: 30px;
        }

        .logo {
            width: 68px;
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            margin-bottom: 18px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 100%
                );

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.24);
        }

        .logo svg {
            width: 34px;
            height: 34px;
        }


        /* =========================================================
           TITLES
           ========================================================= */

        .title {
            color: #0f172a;

            font-size: clamp(25px, 7vw, 32px);

            font-weight: 800;

            line-height: 1.25;

            letter-spacing: -0.5px;
        }

        .subtitle {
            max-width: 340px;

            margin-top: 10px;

            color: #64748b;

            font-size: clamp(13px, 3.8vw, 15px);

            line-height: 1.8;
        }


        /* =========================================================
           GOOGLE BUTTON
           ========================================================= */

        .google-button {
            width: 100%;
            min-height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 11px;

            padding: 13px 16px;

            border: 1px solid #dbe2ea;
            border-radius: 14px;

            background: #ffffff;

            color: #1e293b;

            text-decoration: none;

            font-size: clamp(14px, 4vw, 16px);

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease,
                background-color 0.2s ease;

            user-select: none;
        }

        .google-button:hover {
            background: #f8fafc;

            border-color: #cbd5e1;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.07);
        }

        .google-button:active {
            transform: scale(0.985);
        }

        .google-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.22);
            outline-offset: 3px;
        }

        .google-icon {
            width: 21px;
            height: 21px;

            flex: 0 0 21px;
        }


        /* =========================================================
           ERROR
           ========================================================= */

        .error {
            display: none;

            margin-top: 14px;

            padding: 11px 13px;

            border-radius: 11px;

            border: 1px solid #fecaca;

            background: #fef2f2;

            color: #b91c1c;

            text-align: center;

            font-size: 13px;

            line-height: 1.7;
        }

        .error.show {
            display: block;
        }


        /* =========================================================
           REGISTER
           ========================================================= */

        .register {
            margin-top: 24px;

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.8;
        }

        .register a {
            color: #2563eb;

            font-weight: 700;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }


        /* =========================================================
           SECURITY NOTE
           ========================================================= */

        .security {
            margin-top: 22px;

            padding-top: 19px;

            border-top: 1px solid #eef2f7;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            gap: 7px;

            color: #94a3b8;

            text-align: center;

            font-size: 11px;

            line-height: 1.8;
        }

        .security svg {
            width: 15px;
            height: 15px;

            flex: 0 0 15px;

            margin-top: 3px;
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.7;
        }


        /* =========================================================
           VERY SMALL PHONES
           320px - 359px
           ========================================================= */

        @media (max-width: 359px) {

            .page {
                padding: 14px 11px;
            }

            .card {
                padding: 22px 16px;

                border-radius: 20px;
            }

            .brand {
                margin-bottom: 24px;
            }

            .logo {
                width: 56px;
                height: 56px;

                border-radius: 17px;

                margin-bottom: 14px;
            }

            .logo svg {
                width: 29px;
                height: 29px;
            }

            .title {
                font-size: 23px;
            }

            .subtitle {
                font-size: 12.5px;

                line-height: 1.7;
            }

            .google-button {
                min-height: 51px;

                padding: 11px 10px;

                gap: 8px;

                font-size: 13.5px;
            }

            .google-icon {
                width: 19px;
                height: 19px;

                flex-basis: 19px;
            }

            .register {
                margin-top: 19px;

                font-size: 12.5px;
            }

            .security {
                margin-top: 18px;
                padding-top: 15px;

                font-size: 10.5px;
            }
        }


        /* =========================================================
           SHORT MOBILE SCREENS
           ========================================================= */

        @media (max-height: 620px) {

            .page {
                align-items: flex-start;

                padding-top: 14px;
                padding-bottom: 14px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .logo {
                width: 52px;
                height: 52px;

                margin-bottom: 10px;

                border-radius: 15px;
            }

            .logo svg {
                width: 27px;
                height: 27px;
            }

            .subtitle {
                margin-top: 5px;
            }

            .google-button {
                min-height: 50px;
            }

            .register {
                margin-top: 16px;
            }

            .security {
                margin-top: 14px;
                padding-top: 12px;
            }

            .footer {
                margin-top: 12px;
            }
        }


        /* =========================================================
           TABLETS / DESKTOP
           ========================================================= */

        @media (min-width: 600px) {

            .page {
                padding: 30px;
            }

            .card {
                padding: 42px;
            }
        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }


        /* =========================================================
           DARK MODE
           ========================================================= */

        @media (prefers-color-scheme: dark) {

            body {
                background:
                    radial-gradient(
                        circle at 20% 10%,
                        rgba(99, 102, 241, 0.12),
                        transparent 35%
                    ),
                    #0f172a;

                color: #f8fafc;
            }

            .card {
                background: rgba(15, 23, 42, 0.96);

                border-color: rgba(255, 255, 255, 0.07);

                box-shadow:
                    0 30px 70px rgba(0, 0, 0, 0.25);
            }

            .title {
                color: #f8fafc;
            }

            .subtitle,
            .register {
                color: #94a3b8;
            }

            .google-button {
                background: #1e293b;

                border-color: #334155;

                color: #f8fafc;
            }

            .google-button:hover {
                background: #273449;

                border-color: #475569;
            }

            .security {
                border-top-color: #263449;

                color: #64748b;
            }

            .footer {
                color: #64748b;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <main class="container">

            <section class="card">

                <!-- =================================================
                     BRAND
                     ================================================= -->

                <div class="brand">

                    <div class="logo">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <rect
                                x="4"
                                y="5"
                                width="16"
                                height="14"
                                rx="3"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M10 9L15 12L10 15V9Z"
                                fill="currentColor"
                            />
                        </svg>

                    </div>

                    <h1 class="title">
                        تسجيل الدخول
                    </h1>

                    <p class="subtitle">
                        سجّل الدخول للوصول إلى فيديوهاتك
                        وأدوات التحرير الخاصة بك.
                    </p>

                </div>


                <!-- =================================================
                     GOOGLE LOGIN
                     ================================================= -->

                <a
                    href="/auth/google/login"
                    class="google-button"
                    aria-label="تسجيل الدخول باستخدام Google"
                >

                    <svg
                        class="google-icon"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <path
                            fill="#4285F4"
                            d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.16c1.85-1.7 2.9-4.2 2.9-7.38z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.6c2.64 0 4.86-.87 6.48-2.36l-3.16-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.04H3.25v2.53A9.79 9.79 0 0 0 12 21.6z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.51 13.67A5.88 5.88 0 0 1 6.2 12c0-.58.1-1.14.31-1.67V7.8H3.25A9.61 9.61 0 0 0 2.2 12c0 1.52.36 2.96 1.05 4.2l3.26-2.53z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.29c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.36 14.63 2.4 12 2.4a9.79 9.79 0 0 0-8.75 5.4l3.26 2.53C7.29 8.01 9.45 6.29 12 6.29z"
                        />
                    </svg>

                    <span>
                        تسجيل الدخول باستخدام Google
                    </span>

                </a>


                <!-- =================================================
                     ERROR MESSAGE
                     ================================================= -->

                <div
                    id="auth-error"
                    class="error"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     REGISTER
                     ================================================= -->

                <p class="register">
                    ليس لديك حساب؟
                    <a href="/register">
                        إنشاء حساب جديد
                    </a>
                </p>


                <!-- =================================================
                     SECURITY
                     ================================================= -->

                <div class="security">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >
                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        />

                        <path
                            d="M8 10V7.5C8 5.57 9.57 4 11.5 4H12.5C14.43 4 16 5.57 16 7.5V10"
                        />

                        <circle
                            cx="12"
                            cy="15"
                            r="1"
                        />
                    </svg>

                    <span>
                        تسجيل دخول آمن عبر حساب Google.
                    </span>

                </div>

            </section>


            <!-- =====================================================
                 FOOTER
                 ===================================================== -->

            <div class="footer">
                {{ app_name if app_name else "Video Editor" }}
            </div>

        </main>

    </div>

</body>
</html>
