{% extends "base.html" %}
{% block title %} · إنشاء حساب{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">إنشاء حساب</h1>
        <p class="auth-sub">أنشئ حساباً جديداً لبدء التحرير.</p>
        <form id="register-form" class="auth-form">
            <label class="field">
                <span>البريد الإلكتروني</span>
                <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
            </label>
            <label class="field">
                <span>كلمة المرور</span>
                <input type="password" name="password" required placeholder="6 أحرف على الأقل" autocomplete="new-password">
            </label>
            <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
            <p class="auth-error" id="auth-error"></p>
        </form>
        <p class="auth-switch">لديك حساب؟ <a href="/login">سجّل الدخول</a></p>
        <p class="auth-note">في الوضع المتدني يمكنك استخدام النظام بدون تسجيل دخول.</p>
    </div>
</div>
{% endblock %}
